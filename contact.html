<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <title>Contact | Omar Nedal Khudair</title>
   <link rel="stylesheet" href="styles.css">
</head>
<body>
   <header>
      <nav aria-label="Main navigation">
         <a href="index.html">Home</a>
         <a href="contact.html">Contact</a>
      </nav>
   </header>

   <main>
      <section id="contact">
         <h1>Contact</h1>
         <form id="contact-form" novalidate>
            <p>
               <label for="full-name">Full Name</label><br>
               <input type="text" id="full-name" name="fullName" autocomplete="name" required>
            </p>
            <p>
               <label for="email">Email Address</label><br>
               <input type="email" id="email" name="email" autocomplete="email" required>
            </p>
            <p>
               <label for="country">Country</label><br>
               <input type="text" id="country" name="country" autocomplete="country-name" required>
            </p>
            <p>
               <label for="comments">Comments</label><br>
               <textarea id="comments" name="comments" rows="6" required></textarea>
            </p>
            <button type="submit">Submit</button>
         </form>
      </section>
   </main>
   <script>
  const form = document.getElementById("contact-form");

  form.addEventListener("submit", function (event) {
    event.preventDefault(); // stop the page from reloading

    const name = document.getElementById("full-name").value.trim();
    const email = document.getElementById("email").value.trim();
    const message = document.getElementById("comments").value.trim();
    const country = document.getElementById("country").value.trim();

    if (name === "") {
      alert("Please enter your name.");
      return;
    }

    if (email === "") {
      alert("Please enter your email.");
      return;
    }

    if (!email.includes("@") || !email.includes(".")) {
      alert("Please enter a valid email address.");
      return;
    }

    if (message === "") {
      alert("Please enter a message.");
      return;
    }

    if (country === "") {
      alert("Please enter your country.");
      return;
    }

    alert("Your form was submitted successfully!");
  });
</script>
</body>
</html>
